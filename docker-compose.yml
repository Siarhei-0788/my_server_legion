services:
  app:
    build: .
    restart: unless-stopped
    environment:
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID}
      REGISTRATION_CODE_SECRET: ${REGISTRATION_CODE_SECRET}
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase-service-account.json
      TURN_URLS: ${TURN_URLS}
      TURN_SHARED_SECRET: ${TURN_SHARED_SECRET}
      TURN_CREDENTIAL_TTL_SECONDS: ${TURN_CREDENTIAL_TTL_SECONDS:-3600}
      TURN_EXTERNAL_IP: ${TURN_EXTERNAL_IP}
      TURN_REALM: ${TURN_REALM}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      RTC_CALL_TIMEOUT_MS: ${RTC_CALL_TIMEOUT_MS:-60000}
      TRUST_PROXY: ${TRUST_PROXY:-}
      MESSAGE_RETENTION_DAYS: ${MESSAGE_RETENTION_DAYS:-30}
    secrets:
      - firebase-service-account
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health/live').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    ports:
      - "3000:3000"

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  coturn:
    image: coturn/coturn:4.6
    restart: unless-stopped
    networks:
      default:
        ipv4_address: 172.30.0.10
    command:
      - -n
      - --log-file=stdout
      - --lt-cred-mech
      - --use-auth-secret
      - --static-auth-secret=${TURN_SHARED_SECRET}
      - --realm=${TURN_REALM}
      - --listening-port=3478
      - --tls-listening-port=5349
      - --external-ip=${TURN_EXTERNAL_IP}
      - --cert=/run/secrets/turn-cert
      - --pkey=/run/secrets/turn-key
      - --min-port=49160
      - --max-port=49200
      - --no-cli
      - --no-multicast-peers
      - --no-loopback-peers
    secrets:
      - turn-cert
      - turn-key
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "5349:5349/tcp"
      - "49160-49200:49160-49200/udp"
      - "49160-49200:49160-49200/tcp"

networks:
  default:
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  postgres-data:
  redis-data:

secrets:
  firebase-service-account:
    file: ${FIREBASE_SERVICE_ACCOUNT_FILE}
  turn-cert:
    file: ${TURN_CERT_FILE}
  turn-key:
    file: ${TURN_KEY_FILE}
